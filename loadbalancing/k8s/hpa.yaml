apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: uim-loadbalancing-service
  labels:
    app: uim-loadbalancing-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: uim-loadbalancing-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
